name: Binance RSI + Polymarket Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rsi-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # -------------------------
      # Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      # -------------------------
      # Check files
      # -------------------------
      - name: Check project files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Python version:"
          python --version

          echo ""
          echo "Bot file:"
          test -f bot.py && echo "bot.py exists" || (echo "ERROR: bot.py not found" && exit 1)

      # -------------------------
      # Run Bot
      # -------------------------
      - name: Run RSI Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "=============================="
          echo "Starting Binance RSI Bot"
          echo "=============================="

          python -u bot.py 2>&1 | tee bot_error.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "=============================="
          echo "Bot exit code: $EXIT_CODE"
          echo "=============================="

          exit $EXIT_CODE

      # -------------------------
      # Upload error log
      # -------------------------
      - name: Upload bot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-error-log
          path: bot_error.log
          if-no-files-found: warn

      # -------------------------
      # Save database
      # -------------------------
      - name: Save database
        if: always()
        run: |
          git config user.name "RSI Telegram Bot"
          git config user.email "actions@github.com"

          git add users.json state.json

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update RSI bot database"
            git push
          fi

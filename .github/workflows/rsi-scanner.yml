name: Binance RSI + Polymarket Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Check project
        run: |
          echo "================================"
          echo "Checking project"
          echo "================================"

          python --version
          echo ""

          ls -la
          echo ""

          if [ ! -f bot.py ]; then
            echo "ERROR: bot.py not found!"
            exit 1
          fi

          echo "bot.py found."

      - name: Check Python syntax
        run: |
          python -m py_compile bot.py
          echo "Python syntax is OK."

      - name: Run RSI Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRIVATE_ACCESS_KEY: ${{ secrets.PRIVATE_ACCESS_KEY }}
        run: |
          echo "================================"
          echo "Starting Binance RSI Bot"
          echo "================================"

          python -u bot.py 2>&1 | tee bot_error.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "================================"
          echo

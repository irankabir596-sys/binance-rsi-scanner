name: Binance RSI + Polymarket Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Check project
        run: |
          echo "================================"
          echo "Checking project"
          echo "================================"
          python --version
          ls -la
          test -f bot.py
          echo "bot.py found."

      - name: Check Python syntax
        run: |
          python -m py_compile bot.py
          echo "Python syntax is OK."

      - name: Run RSI Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRIVATE_ACCESS_KEY: ${{ secrets.PRIVATE_ACCESS_KEY }}
        run: |
          echo "================================"
          echo "Starting Binance RSI Bot"
          echo "================================"
          python -u bot.py 2>&1 | tee bot_error.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Bot exit code: $EXIT_CODE"
          exit $EXIT_CODE

      - name: Upload bot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-error-log
          path: bot_error.log
          if-no-files-found: warn

      - name: Save database
        if: always()
        run: |
          git config user.name "RSI Telegram Bot"
          git config user.email "actions@github.com"
          git add users.json state.json
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update RSI bot database"
            git push
          fi
